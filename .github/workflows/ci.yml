name: CI

on:
  push:
    branches: [main, feat/*, codex/*]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Build, Lint, Typecheck and Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: gitdocs_user
          POSTGRES_PASSWORD: gitdocs_password
          POSTGRES_DB: gitdocs_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://gitdocs_user:gitdocs_password@localhost:5432/gitdocs_test?schema=public
      GITHUB_WEBHOOK_SECRET: test-ci-secret-value-phrase
      GEMINI_API_KEY: test-ci-gemini-key
      NEXTAUTH_SECRET: test-ci-nextauth-secret-key-32-chars-long
      NEXTAUTH_URL: http://localhost:3000
      NEXT_PUBLIC_API_URL: http://localhost:4000/api

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run db:generate

      - name: Run Database Migrations
        run: npm run db:migrate:deploy

      - name: Run Typecheck
        run: npm run typecheck

      - name: Run Unit & HTTP Contract Tests
        run: npm run test

      - name: Build Backend
        run: npm run build:backend

      - name: Build Frontend
        run: npm run build:frontend
