version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: gitdocs_postgres
    restart: always
    environment:
      POSTGRES_USER: gitdocs_user
      POSTGRES_PASSWORD: gitdocs_password
      POSTGRES_DB: gitdocs_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
